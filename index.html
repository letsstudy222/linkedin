  /* ---------------- xuất dữ liệu chứng minh ---------------- */
  function csvE(v) {
    v = String(v == null ? "" : v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function csvLine() { return [].slice.call(arguments).map(csvE).join(",") + "\r\n"; }
  function download(name, text, mime) {
    var blob = new Blob(["\uFEFF" + text], { type: (mime || "text/csv") + ";charset=utf-8" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  /* số ngày block rơi vào khoảng (d1, d2] — dùng để đối chiếu giãn cách lịch */
  function blockedBetween(a, d1, d2) {
    var n = 0, today = todayISO();
    (a.blocks || []).forEach(function (b) {
      var st = b.from > d1 ? b.from : d1;
      var en = b.to || today;
      if (en > d2) en = d2;
      var k = diffDays(st, en);
      if (k > 0) n += k;
    });
    return n;
  }

  /* dựng chuỗi giao dịch kèm cột đối chiếu giãn cách */
  function seriesRows(a, kind) {
    var cd = num(a.payoutCycleDays) || 15;
    var std = kind === "in" ? cd : 7;
    var src = kind === "in" ? (a.recvLog || []) : (a.log || []);
    var list = src.slice().sort(function (x, y) {
      return String(x.dueOn).localeCompare(String(y.dueOn));
    });
    var prev = null;
    return list.map(function (e) {
      var gap = prev ? diffDays(prev, e.dueOn) : "";
      var bd = prev ? blockedBetween(a, prev, e.dueOn) : "";
      var expect = prev ? std + bd : "";
      var ok = prev === null ? "lần đầu"
        : (gap === expect ? "Đúng lịch" : (gap > expect ? "Giãn thừa " : "Hụt ") + Math.abs(gap - expect) + " ngày");
      prev = e.dueOn;
      return {
        on: kind === "in" ? e.gotOn : e.paidOn,
        due: e.dueOn,
        label: kind === "in" ? "Nhận lần " + e.seq : "Trả tuần " + e.week + "/4",
        gap: gap, bd: bd, expect: expect, ok: ok,
        usd: kind === "in" ? num(e.amountUSD) : "", vnd: num(e.amountVND)
      };
    });
  }

  /* n mốc sắp tới, chạy tiếp sang chu kỳ sau bằng cách cuộn mốc gốc thêm 1 tháng */
  function upcoming(a, kind, n) {
    var d = derive(a), out = [], today = todayISO(), guard = 0;
    var sh = d.shift;
    if (kind === "out") {
      var base = a.anchor, w = a.paidWeeks, cyc = 0;
      while (out.length < n && guard++ < 40) {
        var du = weekDues(addDays(base, sh));
        for (var i = w; i < 4 && out.length < n; i++) {
          out.push({ lbl: "Tuần " + (i + 1) + "/4" + (cyc ? " (chu kỳ +" + cyc + ")" : ""),
            d: du[i], left: diffDays(today, du[i]), vnd: Math.round(d.weekly), usd: "" });
        }
        base = addMonthsClamp(base, 1, a.anchorDay); w = 0; cyc++;
      }
    } else {
      var pb = a.payAnchor, g = d.gc, cy = 0;
      while (out.length < n && guard++ < 40) {
        for (var j = g; j < d.per && out.length < n; j++) {
          var dd = addDays(addDays(pb, sh), j * d.cd);
          var amt = (j === d.per - 1 && cy === 0) ? Math.max(0, d.cycLeft) : d.evenUSD;
          out.push({ lbl: "Lần " + (j + 1) + "/" + d.per + (cy ? " (chu kỳ +" + cy + ")" : ""),
            d: dd, left: diffDays(today, dd), usd: Math.round(amt * 100) / 100,
            vnd: Math.round(amt * S.rate) });
        }
        pb = addMonthsClamp(pb, 1, a.payAnchorDay); g = 0; cy++;
      }
    }
    return out;
  }

  function txRows(a) {
    var r = [];
    (a.log || []).forEach(function (e) {
      r.push([e.paidOn, a.name, "CHI", "Trả tuần " + e.week + "/4 (hạn " + dmy(e.dueOn) + ")", "", num(e.amountVND)]);
    });
    (a.recvLog || []).forEach(function (e) {
      r.push([e.gotOn, a.name, "THU", "Nhận lần " + e.seq + " (dự kiến " + dmy(e.dueOn) + ")",
        num(e.amountUSD), num(e.amountVND)]);
    });
    return r;
  }

  function exportCSVAll() {
    var t = "SỔ THUÊ TÀI KHOẢN — TOÀN BỘ GIAO DỊCH\r\n";
    t += csvLine("Xuất lúc", new Date().toLocaleString("vi-VN"), "Tỷ giá", S.rate);
    t += "\r\n" + csvLine("Ngày", "Tài khoản", "Loại", "Nội dung", "USD", "VND");
    var all = [];
    S.accounts.forEach(function (a) { all = all.concat(txRows(a)); });
    all.sort(function (x, y) { return String(x[0]).localeCompare(String(y[0])); });
    var sIn = 0, sOut = 0;
    all.forEach(function (r) {
      if (r[2] === "THU") sIn += num(r[5]); else sOut += num(r[5]);
      t += csvLine(dmy(r[0]), r[1], r[2], r[3], r[4], r[5]);
    });
    t += "\r\n" + csvLine("TỔNG THU (VND)", sIn) + csvLine("TỔNG CHI (VND)", sOut) +
      csvLine("CHÊNH LỆCH (VND)", sIn - sOut);
    download("so-thue-tai-khoan-tong-hop-" + todayISO() + ".csv", t);
    audit("Xuất dữ liệu", "", "toàn bộ · " + all.length + " giao dịch");
    save();
  }

  function exportCSVAcc(id) {
    var a = byId(id); if (!a) return;
    var d = derive(a), today = todayISO();
    var t = "SAO KÊ TÀI KHOẢN THUÊ\r\n";
    t += csvLine("Xuất lúc", new Date().toLocaleString("vi-VN"));

    t += "\r\n" + "THÔNG TIN\r\n";
    t += csvLine("Số thứ tự", a.seq) + csvLine("Tên tài khoản", a.name) +
      csvLine("Ngày thuê", dmy(a.rentDate)) + csvLine("Số ngày đã thuê", diffDays(a.rentDate, today)) +
      csvLine("Số kết nối", num(a.connections)) +
      csvLine("Thu cam kết / tháng (USD)", num(a.monthlyIncomeUSD)) +
      csvLine("Chu kỳ nhận", d.cd + " ngày · " + d.per + " lần mỗi chu kỳ") +
      csvLine("Chi / tháng (VND)", num(a.monthlyCostVND)) +
      csvLine("Trả theo tuần (VND)", Math.round(d.weekly)) +
      csvLine("Tỷ giá áp dụng", S.rate);

    t += "\r\n" + "TÌNH TRẠNG\r\n";
    t += csvLine("Số lần bị block", d.blockCount) + csvLine("Tổng ngày chết", d.blockDaysTotal) +
      csvLine("Uptime (" + d.span + " ngày gần nhất)", Math.round(d.uptime * 100) + "%") +
      csvLine("Đang bị block", d.cur ? "CÓ — từ " + dmy(d.cur.from) : "Không") +
      csvLine("Chu kỳ nhận đã chốt", d.closedCyc) +
      csvLine("Tỷ lệ nhận đủ", Math.round(d.fill * 100) + "%") +
      csvLine("Hụt tích luỹ (USD)", Math.round(d.shortUSD * 100) / 100) +
      csvLine("Mốc trả hiện tại", dmy(a.anchor)) +
      csvLine("Mốc nhận hiện tại", dmy(a.payAnchor));

    /* ---- block: ghi rõ dừng từ ngày nào, nối lại ngày nào, dời lịch bao nhiêu ---- */
    t += "\r\n" + "LỊCH SỬ BLOCK — DỪNG VÀ NỐI LẠI LỊCH\r\n";
    if (!(a.blocks || []).length) {
      t += csvLine("Chưa có lần block nào");
    } else {
      t += csvLine("Lần", "Dừng từ ngày", "Nối lại từ ngày", "Số ngày chết", "Dời lịch (ngày)", "Lý do");
      a.blocks.forEach(function (b, i) {
        var dd = blockDays(b, today);
        t += csvLine(i + 1, dmy(b.from), b.to ? dmy(b.to) : "chưa mở", dd,
          b.to ? dd : "đang dừng", b.reason || "");
      });
      t += csvLine("TỔNG SỐ NGÀY ĐÃ DỜI LỊCH", d.shift);
    }

    /* ---- chi: đối chiếu giãn cách 7 ngày ---- */
    var out = seriesRows(a, "out"), inn = seriesRows(a, "in");
    t += "\r\n" + "CHI TIẾT THANH TOÁN — CHUẨN 7 NGÀY / LẦN\r\n";
    t += csvLine("Ngày ghi nhận", "Nội dung", "Hạn theo lịch", "Cách hạn trước (ngày)",
      "Trong đó block (ngày)", "Chuẩn phải là (ngày)", "Đối chiếu", "VND");
    var sOut = 0;
    out.forEach(function (r) {
      sOut += num(r.vnd);
      t += csvLine(dmy(r.on), r.label, dmy(r.due), r.gap, r.bd, r.expect, r.ok, r.vnd);
    });
    if (!out.length) t += csvLine("Chưa có khoản thanh toán nào");

    /* ---- thu: đối chiếu giãn cách theo chu kỳ nhận ---- */
    t += "\r\n" + "CHI TIẾT NHẬN TIỀN — CHUẨN " + d.cd + " NGÀY / LẦN\r\n";
    t += csvLine("Ngày ghi nhận", "Nội dung", "Dự kiến theo lịch", "Cách lần trước (ngày)",
      "Trong đó block (ngày)", "Chuẩn phải là (ngày)", "Đối chiếu", "USD", "VND");
    var sIn = 0, uIn = 0;
    inn.forEach(function (r) {
      sIn += num(r.vnd); uIn += num(r.usd);
      t += csvLine(dmy(r.on), r.label, dmy(r.due), r.gap, r.bd, r.expect, r.ok, r.usd, r.vnd);
    });
    if (!inn.length) t += csvLine("Chưa ghi nhận lần nhận tiền nào");

    /* ---- lịch dự tính sắp tới ---- */
    t += "\r\n" + "LỊCH DỰ TÍNH SẮP TỚI\r\n";
    t += csvLine("Loại", "Kỳ", "Ngày dự tính", "Tình trạng", "USD", "VND");
    var lf = function (n) { return n < 0 ? "trễ " + (-n) + " ngày" : n === 0 ? "hôm nay" : "còn " + n + " ngày"; };
    upcoming(a, "out", 4).forEach(function (r) {
      t += csvLine("PHẢI TRẢ", r.lbl, dmy(r.d), lf(r.left), "", r.vnd);
    });
    upcoming(a, "in", 4).forEach(function (r) {
      t += csvLine("SẼ NHẬN", r.lbl, dmy(r.d), lf(r.left), r.usd, r.vnd);
    });
    if (d.cur) t += csvLine("LƯU Ý", "Đang bị block từ " + dmy(d.cur.from) +
      " — các mốc trên sẽ lùi thêm khi mở lại");

    t += "\r\n" + "TỔNG KẾT\r\n";
    t += csvLine("TỔNG ĐÃ NHẬN (USD)", Math.round(uIn * 100) / 100) +
      csvLine("TỔNG ĐÃ NHẬN (VND)", sIn) + csvLine("TỔNG ĐÃ TRẢ (VND)", sOut) +
      csvLine("CHÊNH LỆCH THỰC TẾ (VND)", sIn - sOut);

    download("sao-ke-" + a.name.replace(/[^a-zA-Z0-9-_]/g, "_") + "-" + todayISO() + ".csv", t);
    audit("Xuất sao kê", a.name, (out.length + inn.length) + " giao dịch");
    save();
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify({ accounts: S.accounts, rate: S.rate, v: 1 }, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "so-thue-tai-khoan-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("fileIn").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        if (!Array.isArray(d.accounts)) throw new Error("bad");
        S.accounts = d.accounts.map(migrate);
        if (d.rate) S.rate = Number(d.rate) || S.rate;
        save(); closeModal(); render(); warn("");
        toast("Đã nạp " + d.accounts.length + " tài khoản từ file");
      } catch (err) { warn("File không đúng định dạng sổ. Chọn file .json đã xuất từ app này."); }
    };
    r.readAsText(file); e.target.value = "";
  });

  /* ---------------- sự kiện ---------------- */
  document.addEventListener("click", function (e) {
    var bg = e.target.classList && e.target.classList.contains("ov");
    if (bg) { closeModal(); return; }
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");

    if (act === "add") openForm(null);
    else if (act === "edit") openForm(byId(id));
    else if (act === "pay") payNext(id);
    else if (act === "undo") undoLast(id);
    else if (act === "got") recvDlg(id);
    else if (act === "gotOk") gotNext(id, document.getElementById("rDate").value,
      document.getElementById("rAmt").value);
    else if (act === "csvAll") { closeModal(); exportCSVAll(); }
    else if (act === "csvAcc") exportCSVAcc(id);
    else if (act === "undoGot") undoGot(id);
    else if (act === "toggle") { var a = byId(id); a.active = a.active === false;
      audit(a.active ? "Thuê lại" : "Ngưng thuê", a.name, ""); save(); render(); }
    else if (act === "blockDlg") blockDlg(id);
    else if (act === "unblockDlg") unblockDlg(id);
    else if (act === "bhist") blockHistory(id);
    else if (act === "blockOk") {
      var bf = document.getElementById("bFrom").value || todayISO();
      if (bf > todayISO()) { toast("Không ghi block cho ngày trong tương lai"); return; }
      addBlock(id, bf, document.getElementById("bWhy").value.trim());
    }
    else if (act === "unblockOk") {
      var ut = document.getElementById("uTo").value || todayISO();
      unblock(id, ut);
    }
    else if (act === "dropBlock") dropBlock(id, b.getAttribute("data-b"));
    else if (act === "rebase") {
      var ar = byId(id); if (!ar) return;
      rebase(ar); save(); render();
      var dr = derive(ar);
      audit("Dựng lại mốc", ar.name, "gốc " + dmy(ar.anchor) + "/" + dmy(ar.payAnchor) +
        " · dời " + dr.shift + " ngày");
      toast("Mốc trả " + dmy(dr.anc) + " · mốc nhận " + dmy(dr.panc));
      blockHistory(id);
    }

    else if (act === "del") {
      var acc = byId(id);
      sheet("Xoá tài khoản",
        '<p class="ask">Xoá <b>' + esc(acc.name) + "</b> cùng toàn bộ lịch sử thanh toán? Thao tác không hoàn tác được.</p>" +
        '<p class="hint">Nếu chỉ dừng thuê, hãy dùng <b>Ngưng thuê</b> — dữ liệu vẫn giữ lại để đối chiếu.</p>',
        '<button class="btn" data-act="close">Giữ lại</button>' +
        '<button class="btn danger" data-act="delOk" data-id="' + id + '">' + ic("trash") + " Xoá vĩnh viễn</button>");
    }
    else if (act === "delOk") {
      var dn = (byId(id) || {}).name || "";
      S.accounts = S.accounts.filter(function (x) { return x.id !== id; });
      audit("Xoá tài khoản", dn, "xoá vĩnh viễn khỏi sổ");
      save(); closeModal(); render(); toast("Đã xoá tài khoản khỏi sổ");
    }
    else if (act === "settings") openSettings();
    else if (act === "cloud") cloudSheet();
    else if (act === "signin") doAuth("password");
    else if (act === "signup") doAuth("signup");
    else if (act === "signout") signOut();
    else if (act === "pullNow") { closeModal(); S.updatedAt = ""; pull(); }
    else if (act === "pushNow") { closeModal(); S.updatedAt = new Date().toISOString(); saveLocal(); push(); }
    else if (act === "saveRate") {
      var up = num(document.getElementById("fUp").value), mg = num(document.getElementById("fMg").value);
      if (up > 0 && up <= 100) S.minUptime = up;
      if (mg > 0 && mg <= 100) S.minMargin = mg;
      save(); closeModal(); render();
      toast("Đã lưu · tỷ giá " + NF.format(S.rate) + " · ngưỡng " + S.minUptime + "% / " + S.minMargin + "%");
    }
    else if (act === "export") exportJSON();
    else if (act === "import") document.getElementById("fileIn").click();
    else if (act === "wipe") {
      if (!S.accounts.length) return;
      var n0 = S.accounts.length; S.accounts = [];
      audit("Xoá toàn bộ", "", n0 + " tài khoản bị xoá"); save(); closeModal(); render();
      toast("Đã xoá toàn bộ sổ");
    }
    else if (act === "submit") submitForm();
    else if (act === "close") closeModal();
    else if (act === "tab") { S.tab = b.getAttribute("data-v"); render(); }
    else if (act === "filter") {
      S.filter = b.getAttribute("data-v");
      var fs = document.querySelectorAll("#filters .f");
      for (var i = 0; i < fs.length; i++) fs[i].className = fs[i] === b ? "f on" : "f";
      render();
    }
  });

  document.getElementById("q").addEventListener("input", function () {
    S.q = this.value;
    document.getElementById("qClear").className = this.value ? "clr" : "clr hide";
    render();
  });
  document.getElementById("qClear").addEventListener("click", function () {
    var q = document.getElementById("q"); q.value = ""; S.q = "";
    this.className = "clr hide"; render(); q.focus();
  });
  document.getElementById("sortSel").addEventListener("change", function () {
    S.sort = this.value; render();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  /* mở lại sau khi máy ngủ / đổi ngày -> cập nhật lại trạng thái đến hạn */
  var lastDay = todayISO();
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (todayISO() !== lastDay) { lastDay = todayISO(); render(); }
    if (CFG.token) pull(true);
  });

  /* ---------------- khởi động ---------------- */
  paintIcons(document);
  cfgLoad();
  load();
  if (fixReport.length) {
    audit("Chuyển sang mốc gốc", "", fixReport.join(" · "));
    save();
    warn("Đã tính lại lịch theo block cho: " + fixReport.join(", ") +
      ". Từ giờ lịch tự dời theo danh sách block nên không lệch được nữa.");
  }
  if (!canStore) warn("Trình duyệt đang chặn lưu trữ (chế độ ẩn danh?). Dữ liệu sẽ mất khi đóng tab.");
  render();
  setSync(CFG.token ? "busy" : "off", CFG.token ? "Đang tải…" : "Chưa đồng bộ");
  if (CFG.token) pull(true);
})();
</script>
</body>
