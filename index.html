<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#33307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ thuê TK">
<meta name="robots" content="noindex, nofollow">
<title>Sổ thuê tài khoản</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --field:#F3F2F7; --panel:#FFFFFF; --panel2:#F8F7FC;
  --ink:#2A2839; --ink2:#5E5B75; --muted:#9694AB;
  --rule:#E8E6F0; --rule2:#F1F0F7;
  --carbon:#6360C9; --carbon-s:#EFEEFC; --carbon-d:#5350B4;
  --red:#C2566B; --red-s:#FCEFF2; --red-b:#F2D6DD;
  --amber:#B4843F; --amber-s:#FBF3E6; --amber-b:#EFDFC4;
  --green:#4E937C; --green-s:#EAF4F0;
  --shadow: 0 1px 2px rgba(42,40,57,.04), 0 6px 18px rgba(42,40,57,.055);
  --shadow-lg: 0 24px 60px rgba(42,40,57,.22);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --cond: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--field); color: var(--ink);
  min-height: 100vh; font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; padding-bottom: 90px;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; border-radius: 8px; }
svg { flex: none; }
.hide { display: none !important; }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--rule); }
.hdr-in { max-width: 1180px; margin: 0 auto; padding: 11px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 7px; margin-right: auto; min-width: 0; }
.mark { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .1em;
  background: var(--carbon); color: #fff; padding: 3px 6px 2px; border-radius: 5px; }
.wordmark { font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .16em;
  text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-act { display: flex; align-items: center; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px;
  border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; color: var(--ink2); background: var(--panel2); }
.chip:hover { border-color: var(--carbon); color: var(--carbon); }
.icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
  border-radius: 11px; color: var(--ink2); }
.icon:hover { background: var(--panel2); color: var(--ink); }
.icon.sm { width: 36px; height: 36px; border: 1px solid var(--rule); flex: none; }

/* layout */
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.banner { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 11px; font-size: 13px;
  background: var(--red-s); color: var(--red); border: 1px solid var(--red-b); }

/* nhắc hạn */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alerts:empty { display: none; }
.alert { border-radius: 13px; padding: 10px 12px; border: 1px solid; }
.a-red { background: var(--red-s); border-color: var(--red-b); }
.a-amber { background: var(--amber-s); border-color: var(--amber-b); }
.alert-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.alert-t { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.a-red .alert-t, .a-red .alert-s { color: var(--red); }
.a-amber .alert-t, .a-amber .alert-s { color: var(--amber); }
.alert-s { font-family: var(--mono); font-size: 12px; }
.alert-b { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 999px; padding: 5px 10px 5px 11px; font-size: 12.5px; max-width: 100%; }
.pill:hover { border-color: var(--carbon); box-shadow: inset 0 0 0 1px var(--carbon); }
.pill-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.pill-v { color: var(--muted); font-size: 11.5px; }

/* thống kê */
.rail { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 13px; overflow: hidden; }
.stat { background: var(--panel); padding: 10px 12px; min-width: 0; }
.stat-l { font-family: var(--cond); font-size: 11px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; }
.stat-m { font-size: 16px; font-weight: 600; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-green { color: var(--green); } .t-red { color: var(--red); }

/* công cụ */
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 13px; padding: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px;
  font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: #fff; }
.search { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 13px; padding: 0 9px; flex: 1; min-width: 170px; color: var(--muted); }
.search input { border: none; background: none; outline: none; padding: 8px 0; width: 100%; font-size: 13.5px; }
.clr { display: flex; color: var(--muted); }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.f { padding: 6px 11px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--rule);
  background: var(--panel); color: var(--ink2); }
.f.on { background: var(--carbon); border-color: var(--carbon); color: #fff; }

/* thẻ */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 13px 14px 10px;
  display: flex; flex-direction: column; }
.card.is-off { opacity: .62; }
.c-top { display: flex; gap: 10px; align-items: flex-start; }
.c-id { min-width: 0; flex: 1; }
.c-name { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.badge { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 8px; white-space: nowrap; flex: none; }
.s-red { background: var(--red-s); color: var(--red); }
.s-amber { background: var(--amber-s); color: var(--amber); }
.s-green { background: var(--green-s); color: var(--green); }
.s-off { background: var(--panel2); color: var(--muted); }
.s-block { background: var(--carbon); color: #fff; }
.card.is-blocked { border-color: #D3D1F0; box-shadow: inset 3px 0 0 var(--carbon); }
.card.is-blocked .punch { opacity: .42; }
.bar { display: flex; align-items: center; gap: 8px; background: var(--carbon-s); border: 1px solid #DFDDF6;
  border-radius: 11px; padding: 9px 11px; margin-top: 10px; font-size: 12.5px; color: var(--carbon); }
.bar b { font-weight: 700; }
.unblock { flex: 1; justify-content: center; background: var(--carbon); color: #fff; border-color: var(--carbon); }
.unblock:hover { background: var(--carbon-d); }
.binfo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11.5px;
  color: var(--muted); margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--rule2); }
.binfo .bad { color: var(--red); font-weight: 600; }
.a-slate { background: var(--carbon-s); border-color: #DFDDF6; }
.a-slate .alert-t, .a-slate .alert-s { color: var(--carbon); }
.blist { display: flex; flex-direction: column; gap: 8px; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; border: 1px solid var(--rule);
  border-radius: 11px; padding: 9px 11px; }
.brow.open { border-color: var(--carbon); background: var(--carbon-s); }
.brow-d { font-size: 13px; font-weight: 600; }
.brow-x { font-size: 12px; text-align: right; white-space: nowrap; color: var(--ink2); }
.brow-n { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.brow-a { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
  margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--rule); }
.brow-s { font-size: 11px; color: var(--muted); }
.perf { height: 1px; margin: 11px -14px; border-top: 1px dashed var(--rule); }

/* hàng đợi việc hôm nay */
.queue { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.q-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 9px 13px; background: var(--ink); color: #fff; }
.q-t { font-family: var(--cond); font-weight: 700; font-size: 12.5px; letter-spacing: .13em; text-transform: uppercase; }
.q-s { font-family: var(--mono); font-size: 12px; opacity: .82; }
.q-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-bottom: 1px solid var(--rule2); }
.q-row:last-child { border-bottom: none; }
.q-n { font-family: var(--mono); font-size: 11px; width: 17px; height: 17px; flex: none; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--muted); }
.q-row.p-0 .q-n { background: var(--red); color: #fff; }
.q-row.p-1 .q-n { background: var(--amber); color: #fff; }
.q-row.p-2 .q-n { background: var(--carbon); color: #fff; }
.q-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-why { font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.q-row.p-0 .q-why { color: var(--red); font-weight: 600; }
.q-amt { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.q-btn { flex: none; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--rule); background: var(--panel2); }
.q-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.q-more { padding: 8px 13px; background: var(--panel2); font-size: 11.5px; color: var(--muted); }
.q-more b { color: var(--ink2); }
.queue.calm .q-h { background: var(--green-s); color: var(--green); }
.calm-b { padding: 10px 13px; font-size: 12.5px; color: var(--ink2); }

/* dòng nhận định danh mục */
.insight { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted);
  padding: 0 2px; margin-top: -4px; }
.insight b { color: var(--ink2); font-weight: 600; }
.insight .bad { color: var(--red); }

/* nhận định trên thẻ */
.card { position: relative; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: 16px 0 0 16px; background: transparent; }
.card.v-keep::before { background: var(--green); }
.card.v-watch::before { background: var(--amber); }
.card.v-drop::before { background: var(--red); }
.card.v-new::before { background: var(--rule); }

/* lưới chỉ số */
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule2);
  border: 1px solid var(--rule2); border-radius: 13px; overflow: hidden; }
.m { background: var(--panel); padding: 8px 10px; min-width: 0; }
.m-l { font-family: var(--cond); font-size: 10px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; }
.m-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14.5px; font-weight: 600;
  margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-s { font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mfoot { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); margin-top: 7px; }
.mfoot b { color: var(--ink2); font-family: var(--mono); }

/* thanh thời gian chết */
.tl { margin-top: 11px; }
.tl-bar { height: 6px; border-radius: 8px; overflow: hidden; background: var(--green-s); }
.tl-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.vd { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.vd::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.vd.v-keep { color: var(--green); } .vd.v-watch { color: var(--amber); }
.vd.v-drop { color: var(--red); } .vd.v-new { color: var(--muted); }

/* sắp xếp */
.sortsel { border: 1px solid var(--rule); background: var(--panel); border-radius: 13px; padding: 7px 9px;
  font-size: 12.5px; color: var(--ink2); outline: none; }
.sortsel:focus { border-color: var(--carbon); }
.cyc { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.cyc-l { font-family: var(--cond); font-size: 11px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; }
.cyc-v { font-size: 12px; color: var(--ink2); }

/* ô đánh dấu */
.punch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cell { position: relative; border: 1px solid var(--rule); border-radius: 11px; background: var(--panel2);
  padding: 8px 4px 7px; text-align: center; overflow: hidden; }
.cell-w { display: block; font-family: var(--cond); font-size: 10.5px; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.cell-d { display: block; font-size: 12px; margin-top: 1px; color: var(--ink2); }
.cell.next { border-color: var(--carbon); background: var(--carbon-s); box-shadow: inset 0 0 0 1px var(--carbon); }
.cell.next .cell-w, .cell.next .cell-d { color: var(--carbon); }
.cell.late { border-color: var(--red); background: var(--red-s); box-shadow: inset 0 0 0 1px var(--red); }
.cell.late .cell-w, .cell.late .cell-d { color: var(--red); }
.cell.paid { background: var(--panel); border-color: var(--rule2); }
.cell.paid .cell-w, .cell.paid .cell-d { color: var(--rule); }
.stamp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--carbon); border: 1.5px solid var(--carbon); border-radius: 8px;
  transform: rotate(-7deg) scale(.94); opacity: .82; background: rgba(255,255,255,.55);
  animation: stampIn .22s cubic-bezier(.2,1.4,.5,1); }
@keyframes stampIn { from { transform: rotate(-7deg) scale(1.5); opacity: 0; } }

.pay { display: flex; gap: 7px; margin-top: 10px; }
.pay-btn { flex: 1; justify-content: center; background: var(--carbon); color: #fff; border-color: var(--carbon); }
.pay-btn:hover { background: var(--carbon-d); }
.due-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.due-note b { color: var(--ink2); }
.fin { margin: 0; display: flex; flex-direction: column; gap: 5px; }
.fin > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fin dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fin dd { margin: 0; font-size: 13px; font-weight: 600; text-align: right; }
.fin .u { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 5px; }
.note { margin: 10px 0 0; font-size: 12px; color: var(--ink2); background: var(--panel2);
  border-left: 2px solid var(--rule); padding: 6px 9px; border-radius: 0 8px 8px 0; white-space: pre-wrap; }
.c-act { display: flex; gap: 14px; margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--rule2); }
.link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.link:hover { color: var(--carbon); }
.link.danger:hover { color: var(--red); }
.link.inline { margin-left: 6px; text-decoration: underline; }

/* sổ chi */
.ledger { display: flex; flex-direction: column; gap: 12px; }
.lmonth { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.lmonth-h { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 13px;
  background: var(--panel2); border-bottom: 1px solid var(--rule); font-family: var(--cond); font-weight: 700;
  font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; }
.lmonth-h span:last-child { letter-spacing: 0; text-transform: none; color: var(--ink2); }
.ltab { width: 100%; border-collapse: collapse; }
.ltab td { padding: 8px 13px; border-bottom: 1px solid var(--rule2); font-size: 13px; vertical-align: middle; }
.ltab tr:last-child td { border-bottom: none; }
.lt-d { width: 96px; color: var(--ink2); font-size: 12px; }
.lt-n { font-weight: 600; }
.lt-w { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.lt-a { text-align: right; white-space: nowrap; }

/* rỗng */
.empty { background: var(--panel); border: 1px dashed var(--rule); border-radius: 16px; padding: 40px 22px;
  text-align: center; color: var(--muted); }
.empty svg { color: var(--rule); }
.empty h3 { margin: 10px 0 4px; font-size: 15px; color: var(--ink); }
.empty p { margin: 0 auto 14px; max-width: 380px; font-size: 13px; }
.foot { font-size: 11.5px; color: var(--muted); text-align: center; padding: 8px 0 0; line-height: 1.7; }
.foot b { color: var(--ink2); }

/* nút */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border-radius: 11px;
  border: 1px solid var(--rule); background: var(--panel); font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #3B3950; }
.btn.danger { color: var(--red); border-color: var(--red-b); background: var(--red-s); }
.btn.danger:hover { background: #F8E3E8; }
.fab { display: none; }

/* lớp phủ */
.ov { position: fixed; inset: 0; z-index: 60; background: rgba(42,40,57,.34); -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--panel); border-radius: 20px; width: 100%; max-width: 420px; max-height: 90vh;
  display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(42,40,57,.22); animation: rise .2s ease; }
.sheet.wide { max-width: 520px; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 14px 13px 17px; border-bottom: 1px solid var(--rule); }
.sheet-h h2 { margin: 0; font-family: var(--cond); font-size: 16px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; }
.sheet-b { padding: 16px 17px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 17px;
  border-top: 1px solid var(--rule); background: var(--panel2); border-radius: 0 0 20px 20px; }
.sheet-f .btn { flex: 1; justify-content: center; }

/* biểu mẫu */
.sec { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--carbon); padding-bottom: 6px; border-bottom: 1px solid var(--rule); margin: 20px 0 12px; }
.sec.first { margin-top: 0; }
.fl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; }
.tag { font-family: var(--cond); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--carbon-s); color: var(--carbon); padding: 2px 5px; border-radius: 5px; margin-left: 6px; }
.in { width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 11px; background: var(--panel);
  font-size: 16px; outline: none; }
.in:focus { border-color: var(--carbon); box-shadow: 0 0 0 3px var(--carbon-s); }
.in.bad { border-color: var(--red); }
.in.ta { min-height: 62px; resize: vertical; font-size: 15px; }
.in.mini { width: 84px; padding: 7px 8px; }
.hint { font-size: 11.5px; color: var(--muted); margin: 5px 0 14px; }

  var KEY = "acct-rental-ledger-v1";
  var mem = null, canStore = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { canStore = false; }

  var S = { accounts: [], rate: 26000, tab: "accounts", filter: "all", q: "", sort: "seq",
    minUptime: 90, minMargin: 30, updatedAt: "", audit: [] };

  /* nhật ký hành động: ai làm gì, lúc nào — đồng bộ cùng dữ liệu */
  function audit(act, name, detail) {
    if (!Array.isArray(S.audit)) S.audit = [];
    S.audit.push({ ts: new Date().toISOString(), act: act, name: name || "", detail: detail || "" });
    if (S.audit.length > 400) S.audit = S.audit.slice(-400);
  }

  /* nhận định: app tự đưa ra kết luận thay vì bắt người dùng tự đọc số */
  function verdict(d) {
    var up = d.uptime * 100;
    var mg = d.inVND > 0 ? d.realProfit / d.inVND * 100 : 0;
    if (d.span < 14) return { k: "new", l: "Mới thuê", r: "còn " + (14 - d.span) + " ngày nữa mới đủ dữ liệu" };
    if (d.realProfit < 0) return { k: "drop", l: "Đang lỗ", r: "lãi thực tế âm" };
    if (d.closedCyc >= 1 && d.fill < 0.75)
      return { k: "drop", l: "Cân nhắc bỏ", r: "chỉ nhận được " + Math.round(d.fill * 100) + "% số tiền cam kết" };
    if (d.closedCyc >= 1 && d.fill < 0.92)
      return { k: "watch", l: "Theo dõi", r: "nhận thiếu " + Math.round((1 - d.fill) * 100) + "% (" + usdF(d.shortUSD) + ")" };
    if (up < S.minUptime * 0.85 || mg < S.minMargin * 0.5)
      return { k: "drop", l: "Cân nhắc bỏ", r: up < S.minUptime * 0.85 ? "uptime " + Math.round(up) + "% quá thấp" : "biên thực chỉ " + Math.round(mg) + "%" };
    if (up < S.minUptime || mg < S.minMargin)
      return { k: "watch", l: "Theo dõi", r: up < S.minUptime ? "uptime " + Math.round(up) + "% dưới ngưỡng" : "biên thực " + Math.round(mg) + "% dưới ngưỡng" };
    return { k: "keep", l: "Giữ", r: "uptime " + Math.round(up) + "% · biên " + Math.round(mg) + "%" };
  }

  /* thanh thời gian chết: vẽ bằng một gradient duy nhất, không tạo 90 thẻ con */
  function timelineBG(a, span) {
    var today = todayISO(), w0 = addDays(today, -(span - 1)), end = addDays(today, 1);
    var segs = [];
    (a.blocks || []).forEach(function (b) {
      var s = b.from > w0 ? b.from : w0;
      var e = b.to || end; if (e > end) e = end;
      var s0 = diffDays(w0, s), e0 = diffDays(w0, e);
      if (e0 > s0) segs.push([Math.max(0, s0 / span * 100), Math.min(100, e0 / span * 100)]);
    });
    if (!segs.length) return "var(--green-s)";
    segs.sort(function (x, y) { return x[0] - y[0]; });
    var parts = [], pos = 0;
    segs.forEach(function (s) {
      if (s[0] > pos) parts.push("var(--green-s) " + pos + "%", "var(--green-s) " + s[0] + "%");
      parts.push("var(--red) " + Math.max(s[0], pos) + "%", "var(--red) " + s[1] + "%");
      pos = s[1];
    });
    parts.push("var(--green-s) " + pos + "%", "var(--green-s) 100%");
    return "linear-gradient(90deg," + parts.join(",") + ")";
  }

  /* sổ lưu từ bản cũ chưa có trường block -> bổ sung để không vỡ */
  function migrate(a) {
    if (!Array.isArray(a.blocks)) a.blocks = [];
    if (typeof a.payoutShift !== "number") a.payoutShift = 0;
    if (!Array.isArray(a.recvLog)) a.recvLog = [];
    if (typeof a.gotCount !== "number") a.gotCount = 0;
    if (!a.payAnchor) {
      /* sổ cũ tính ngày nhận từ ngày thuê + số ngày đã dời -> quy về mốc chu kỳ */
      var base = addDays(a.rentDate || todayISO(), num(a.payoutShift));
      var cdm = num(a.payoutCycleDays) || 15;
      var perm = Math.max(1, Math.round(30 / cdm)), g = 0;
      while (diffDays(todayISO(), addDays(base, (perm - 1) * cdm)) < 0 && g < 400) {
        base = addMonthsClamp(base, 1, fromISO(base).getDate()); g++;
      }
      a.payAnchor = base;
    }
    if (!a.payAnchorDay) a.payAnchorDay = fromISO(a.payAnchor).getDate();
    if (typeof a.seq !== "number") a.seq = 0;
    toBaseAnchors(a);
    a.blockPolicy = "both";   /* chốt một thoả thuận duy nhất, không còn tuỳ chọn */
    if (!Array.isArray(a.log)) a.log = [];
    if (typeof a.paidWeeks !== "number") a.paidWeeks = 0;
    if (!a.anchorDay) a.anchorDay = fromISO(a.anchor || a.rentDate || todayISO()).getDate();
    return a;
  }

  /* Sửa lỗi cũ: block đã đóng nhưng chưa dời lịch (do bản trước còn tuỳ chọn thoả thuận).
     Chạy một lần cho mỗi tài khoản, có cờ đánh dấu để không dời chồng. */
  /* Dựng lại mốc GỐC từ lịch sử giao dịch, không tin vào con số dời đã ghi.
     Mốc gốc kỳ đầu = hạn của lần trả/nhận đầu tiên từng ghi (khi đó chưa có block),
     rồi cuộn thêm 1 tháng cho mỗi chu kỳ đã hoàn tất. Hoàn toàn xác định,
     chạy lại bao nhiêu lần cũng ra một kết quả. */
  var fixReport = [];
  function rebase(a) {
    var cd = num(a.payoutCycleDays) || 15;
    var per = Math.max(1, Math.round(30 / cd));

    var lg = (a.log || []).slice().sort(function (x, y) {
      return String(x.dueOn).localeCompare(String(y.dueOn));
    });
    if (lg.length) {
      var doneCyc = Math.floor(lg.length / 4);
      a.anchor = addMonthsClamp(lg[0].dueOn, doneCyc, fromISO(lg[0].dueOn).getDate());
      a.paidWeeks = lg.length % 4;
    } else if (!a.anchor) {
      a.anchor = a.rentDate || todayISO();
    }
    a.anchorDay = fromISO(a.anchor).getDate();

    var rg = (a.recvLog || []).slice().sort(function (x, y) {
      return String(x.dueOn).localeCompare(String(y.dueOn));
    });
    if (rg.length) {
      var doneR = Math.floor(rg.length / per);
      a.payAnchor = addMonthsClamp(rg[0].dueOn, doneR, fromISO(rg[0].dueOn).getDate());
      a.gotCount = rg.length % per;
    } else if (!a.payAnchor) {
      a.payAnchor = a.rentDate || todayISO();
    }
    a.payAnchorDay = fromISO(a.payAnchor).getDate();
    return a;
  }

  function toBaseAnchors(a) {
    if (a.baseV6) return a;
    a.baseV6 = 1;
    var before = a.anchor + "|" + a.payAnchor;
    /* dọn rác của bản cũ để không ai còn đọc nhầm */
    (a.blocks || []).forEach(function (b) { delete b.shiftA; delete b.shiftP; });
    rebase(a);
    var sh = shiftOf(a);
    if (sh || before !== a.anchor + "|" + a.payAnchor) {
      fixReport.push(a.name + (sh ? " (lịch dời " + sh + " ngày)" : " (dựng lại mốc)"));
    }
    return a;
  }

  function seedSeq() {
    var mx = 0;
    S.accounts.forEach(function (a) { if (num(a.seq) > mx) mx = num(a.seq); });
    S.accounts.forEach(function (a) { if (!num(a.seq)) a.seq = ++mx; });
  }

  function load() {
    try {
      var raw = canStore ? localStorage.getItem(KEY) : mem;
      if (!raw) return;
      var d = JSON.parse(raw);
      if (Array.isArray(d.accounts)) S.accounts = d.accounts.map(migrate);
      if (Array.isArray(d.audit)) S.audit = d.audit;
      seedSeq();
      if (d.rate) S.rate = Number(d.rate) || 26000;
      if (d.minUptime) S.minUptime = Number(d.minUptime) || 90;
      if (d.minMargin) S.minMargin = Number(d.minMargin) || 30;
      if (d.updatedAt) S.updatedAt = d.updatedAt;
    } catch (e) { warn("Không đọc được dữ liệu đã lưu. Sổ mở ở trạng thái trống."); }
  }
  function saveLocal() {
    var raw = JSON.stringify({ accounts: S.accounts, rate: S.rate, audit: S.audit,
      minUptime: S.minUptime, minMargin: S.minMargin, updatedAt: S.updatedAt, v: 3 });
    try { if (canStore) localStorage.setItem(KEY, raw); else mem = raw; }
    catch (e) { warn("Chưa lưu được. Bộ nhớ trình duyệt đầy hoặc đang ở chế độ ẩn danh."); }
  }
  function save() {
    S.updatedAt = new Date().toISOString();
    saveLocal();
    schedulePush();
  }
  function warn(m) {
    var w = document.getElementById("warn");
    if (!m) { w.className = "banner hide"; return; }
    w.className = "banner"; w.innerHTML = ic("alert") + " " + esc(m);
  }

  /* ---------------- nghiệp vụ ---------------- */
  function weekDues(anchor) { return [0, 7, 14, 21].map(function (n) { return addDays(anchor, n); }); }

  /* Tổng ngày phải dời lịch = tổng ngày chết của các lần block ĐÃ ĐÓNG.
     Tính lại từ đầu mỗi lần dùng, KHÔNG cộng dồn vào mốc -> không bao giờ lệch.
     Xoá một lần block thì lịch tự lùi về đúng, không cần thao tác bù. */
  function shiftOf(a) {
    var n = 0;
    (a.blocks || []).forEach(function (b) {
      if (!b.to) return;
      var k = diffDays(b.from, b.to);
      if (k > 0) n += k;
    });
    return n;
  }
  function effAnchor(a) { return addDays(a.anchor, shiftOf(a)); }
  function effPay(a) { return addDays(a.payAnchor, shiftOf(a)); }

  /* số ngày mất của một lần block; chưa mở thì tính đến hôm nay */
  function blockDays(b, today) { return Math.max(0, diffDays(b.from, b.to || today)); }

  function derive(a) {
    var today = todayISO(), shift = shiftOf(a);
    var anc = addDays(a.anchor, shift), panc = addDays(a.payAnchor, shift);
    var dues = weekDues(anc);
    var nextDue = dues[a.paidWeeks] || dues[0];
    var left = diffDays(today, nextDue);
    var weekly = num(a.monthlyCostVND) / 4;
    var inVND = num(a.monthlyIncomeUSD) * S.rate;
    var outVND = num(a.monthlyCostVND);
    var profit = inVND - outVND;
    var margin = inVND > 0 ? profit / inVND : 0;
    var cd = num(a.payoutCycleDays) || 15;
    var perUSD = a.perPayoutManual ? num(a.perPayoutUSD) : num(a.monthlyIncomeUSD) * cd / 30;
    /* chu kỳ nhận: per lần mỗi chu kỳ, nhận đủ thì mốc nhảy sang tháng sau */
    var per = Math.max(1, Math.round(30 / cd));
    var gc = Math.min(Math.max(0, num(a.gotCount)), per - 1);
    var payDues = [];
    for (var j = 0; j < per; j++) payDues.push(addDays(panc, j * cd));
    var np = payDues[gc];
    var pLeft = diffDays(today, np);

    /* tiền thực nhận: chu kỳ đang mở và tỷ lệ nhận đủ của các chu kỳ đã đóng */
    var recv = a.recvLog || [], cycGot = 0, allGot = 0, byCyc = {};
    var cycExpect = num(a.monthlyIncomeUSD), evenUSD = per > 0 ? cycExpect / per : 0;
    recv.forEach(function (e) {
      allGot += num(e.amountUSD);
      if (e.cycleAnchor === a.payAnchor) { cycGot += num(e.amountUSD); return; }
      var k = e.cycleAnchor || "?";
      if (!byCyc[k]) byCyc[k] = { got: 0, exp: num(e.cycleExpect) || cycExpect };
      byCyc[k].got += num(e.amountUSD);
    });
    var tGot = 0, tExp = 0, closedCyc = 0;
    for (var ck in byCyc) { tGot += byCyc[ck].got; tExp += byCyc[ck].exp; closedCyc++; }
    var fill = tExp > 0 ? tGot / tExp : 1;
    var shortUSD = tExp - tGot;

    /* ---- block ---- */
    var blocks = a.blocks || [], cur = null, totalDays = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (!blocks[i].to) cur = blocks[i];
      totalDays += blockDays(blocks[i], today);
    }
    var curDays = cur ? blockDays(cur, today) : 0;

    /* uptime tính trên tối đa 90 ngày gần nhất, không vượt quá thời gian đã thuê */
    var span = Math.min(90, Math.max(1, diffDays(a.rentDate || today, today) + 1));
    var w0 = addDays(today, -(span - 1)), lost = 0;
    blocks.forEach(function (b) {
      var s = b.from > w0 ? b.from : w0;
      var e = b.to || today;
      if (e > today) e = today;
      var d = diffDays(s, e);
      if (d > 0) lost += d;
    });
    if (lost > span) lost = span;
    var uptime = (span - lost) / span;

    /* lãi thực tế: thu luôn giảm theo uptime; chi chỉ giảm nếu thoả thuận dừng cả hai */
    var effIn = inVND * uptime;
    var effOut = outVND * uptime;
    var realProfit = effIn - effOut;

    /* đang block => tạm dừng cả nghĩa vụ trả lẫn kỳ nhận */
    var dueActive = !cur;

    var st = "ok";
    if (a.active === false) st = "off";
    else if (cur) st = "blocked";
    else if (left < 0) st = "overdue";
    else if (left === 0) st = "today";
    else if (left === 1) st = "tomorrow";
    else if (left <= 7) st = "soon";

    return { dues: dues, nextDue: nextDue, left: left, weekly: weekly, inVND: inVND, outVND: outVND,
      profit: profit, margin: margin, perUSD: perUSD, nextPayout: np, status: st, cd: cd,
      per: per, gc: gc, payDues: payDues, pLeft: pLeft, recvActive: !cur,
      shift: shift, anc: anc, panc: panc,
      cycGot: cycGot, cycExpect: cycExpect, cycLeft: cycExpect - cycGot, evenUSD: evenUSD,
      fill: fill, shortUSD: shortUSD, closedCyc: closedCyc, gotAllUSD: allGot,
      cur: cur, curDays: curDays, blockCount: blocks.length, blockDaysTotal: totalDays,
      uptime: uptime, span: span, realProfit: realProfit, dueActive: dueActive };
  }

  var ST = {
    overdue: ["Quá hạn", "s-red"], today: ["Đến hạn hôm nay", "s-red"], tomorrow: ["Đến hạn ngày mai", "s-amber"],
    soon: ["Sắp đến hạn", "s-amber"], ok: ["Trong hạn", "s-green"], off: ["Đã ngưng", "s-off"],
    blocked: ["Đang bị block", "s-block"]
  };

  var POL = { both: "Dừng cả hai — không nhận tiền, không phải trả" };

  /* ---- nhận tiền: đối xứng với thanh toán ---- */
  function gotNext(id, onDate, amtUSD) {
    var a = byId(id); if (!a) return;
    var d = derive(a);
    if (!d.recvActive) { toast("Đang bị block — chu kỳ nhận đang tạm dừng"); return; }
    var seq = d.gc + 1;
    var amt = Math.round(num(amtUSD) * 100) / 100;
    var day = onDate || todayISO();
    a.recvLog = a.recvLog || [];
    a.recvLog.push({ id: uid(), seq: seq, dueOn: d.payDues[d.gc], gotOn: day,
      amountUSD: amt, amountVND: Math.round(amt * S.rate),
      cycleAnchor: a.payAnchor, cycleExpect: d.cycExpect, name: a.name });
    if (seq >= d.per) {
      var tot = d.cycGot + amt, sh = d.cycExpect - tot;
      a.payAnchor = addMonthsClamp(a.payAnchor, 1, a.payAnchorDay);
      a.gotCount = 0;
      audit("Nhận tiền", a.name, "lần " + seq + "/" + d.per + " · " + usdF(amt) +
        " · chốt chu kỳ: thực nhận " + usdF(tot) + "/" + usdF(d.cycExpect) +
        (Math.abs(sh) >= 0.01 ? (sh > 0 ? " · hụt " + usdF(sh) : " · dư " + usdF(-sh)) : " · đủ"));
      toast(a.name + ": chốt chu kỳ — thực nhận " + usdF(tot) + "/" + usdF(d.cycExpect) +
        (sh > 0.009 ? ", hụt " + usdF(sh) : ", đủ") + ". Chu kỳ mới từ " + dmy(effPay(a)));
    } else {
      a.gotCount = seq;
      audit("Nhận tiền", a.name, "lần " + seq + "/" + d.per + " · " + usdF(amt));
      toast(a.name + ": đã nhận lần " + seq + "/" + d.per + " · " + usdF(amt));
    }
    closeModal(); save(); render();
  }

  /* hộp thoại nhận tiền: mặc định chia đều, lần cuối chu kỳ mặc định phần còn thiếu */
  function recvDlg(id) {
    var a = byId(id); if (!a) return;
    var d = derive(a);
    if (!d.recvActive) { toast("Đang bị block — chu kỳ nhận đang tạm dừng"); return; }
    var isLast = d.gc + 1 >= d.per;
    var def = isLast ? Math.max(0, d.cycLeft) : d.evenUSD;
    def = Math.round(def * 100) / 100;
    sheet("Nhận tiền · " + esc(a.name),
      '<p class="ask">Lần <b>' + (d.gc + 1) + "/" + d.per + "</b> của chu kỳ bắt đầu <b>" +
      dmy(a.payAnchor) + "</b>, dự kiến ngày <b>" + dmy(d.nextPayout) + "</b>.</p>" +
      '<div class="prog"><div class="prog-h"><span>Chu kỳ này đã nhận</span><span class="mono">' +
      usdF(d.cycGot) + " / " + usdF(d.cycExpect) + '</span></div><div class="prog-bar"><i style="width:' +
      Math.min(100, d.cycExpect > 0 ? d.cycGot / d.cycExpect * 100 : 0) + '%"></i></div>' +
      '<div class="prog-f">Còn <b>' + usdF(Math.max(0, d.cycLeft)) + "</b> chưa nhận" +
      (isLast ? " — đây là lần cuối chu kỳ, mặc định điền đúng phần còn thiếu" : "") + "</div></div>" +
      '<label class="fl" for="rDate">Ngày nhận thực tế</label>' +
      '<input class="in" id="rDate" type="date" value="' + todayISO() + '">' +
      '<label class="fl" for="rAmt">Số tiền nhận được (USD)</label>' +
      '<input class="in mono" id="rAmt" type="number" step="0.01" inputmode="decimal" value="' + def + '">' +
      '<p class="hint" id="hRecv"></p>',
      '<button class="btn" data-act="close">Huỷ</button>' +
      '<button class="btn primary" data-act="gotOk" data-id="' + id + '">Xác nhận đã nhận</button>');

    function upd() {
      var v = num(document.getElementById("rAmt").value);
      var diff = v - d.evenUSD;
      document.getElementById("hRecv").innerHTML = "= <b>" + vnd(v * S.rate) + "</b>" +
        (Math.abs(diff) >= 0.01
          ? " · " + (diff > 0 ? "nhiều hơn" : "ít hơn") + " mức chia đều " + usdF(Math.abs(diff))
          : " · đúng mức chia đều");
    }
    document.getElementById("rAmt").addEventListener("input", upd);
    upd();
  }

  function undoGot(id) {
    var a = byId(id); if (!a || !a.recvLog || !a.recvLog.length) return;
    var last = a.recvLog.pop();
    var per = Math.max(1, Math.round(30 / (num(a.payoutCycleDays) || 15)));
    if (last.seq >= per) { a.gotCount = per - 1; a.payAnchor = last.cycleAnchor;
      a.payAnchorDay = fromISO(a.payAnchor).getDate(); }
    else { a.gotCount = Math.max(0, num(a.gotCount) - 1); }
    audit("Hoàn tác", a.name, "bỏ lần nhận " + last.seq + " · " + usdF(last.amountUSD));
    save(); render(); toast("Đã hoàn tác lần nhận gần nhất");
  }

  /* ---- ghi block / mở block ---- */  function addBlock(id, from, reason) {
    var a = byId(id); if (!a) return;
    a.blocks = a.blocks || [];
    for (var i = 0; i < a.blocks.length; i++) if (!a.blocks[i].to) return;
    a.blocks.push({ id: uid(), from: from, to: null, reason: reason || "" });
    audit("Ghi block", a.name, "từ " + dmy(from) + (reason ? " · " + reason : ""));
    save(); closeModal(); render();
    toast(a.name + ": đã ghi nhận block từ " + dmy(from));
  }

  function unblock(id, to) {
    var a = byId(id); if (!a) return;
    var cur = null;
    (a.blocks || []).forEach(function (b) { if (!b.to) cur = b; });
    if (!cur) return;
    if (to < cur.from) { toast("Ngày mở phải sau ngày bị block"); return; }
    var days = diffDays(cur.from, to);
    cur.to = to; cur.days = days;
    /* KHÔNG cộng vào mốc — lịch tự dời vì shiftOf() đọc lại toàn bộ danh sách block */
    var nd = derive(a);
    audit("Mở block", a.name, days + " ngày chết · tổng dời " + nd.shift +
      " ngày · mốc trả " + dmy(nd.anc) + " · mốc nhận " + dmy(nd.panc));
    save(); closeModal(); render();
    toast(a.name + ": mở lại sau " + days + " ngày · mốc trả " + dmy(nd.anc) + " · mốc nhận " + dmy(nd.panc));
  }

  /* xoá một lần block: lịch tự lùi lại vì shiftOf() tính lại từ đầu */
  function dropBlock(accId, bId) {
    var a = byId(accId); if (!a || !a.blocks) return;
    a.blocks = a.blocks.filter(function (b) { return b.id !== bId; });
    audit("Xoá block", a.name, "hoàn lại lịch cũ");
    save(); render(); toast("Đã xoá lần block và hoàn lại lịch cũ");
    blockHistory(accId);
  }

  function byId(id) { for (var i = 0; i < S.accounts.length; i++) if (S.accounts[i].id === id) return S.accounts[i]; return null; }

  function payNext(id) {
    var a = byId(id); if (!a) return;
    var week = a.paidWeeks + 1; if (week > 4) return;
    var dues = weekDues(a.anchor);
    a.log = a.log || [];
    a.log.push({ id: uid(), week: week, dueOn: dues[a.paidWeeks], paidOn: todayISO(),
      amountVND: Math.round(num(a.monthlyCostVND) / 4), cycleAnchor: a.anchor, name: a.name });
    if (week === 4) {
      a.anchor = addMonthsClamp(a.anchor, 1, a.anchorDay);
      a.paidWeeks = 0;
      audit("Thanh toán", a.name, "tuần 4/4 · " + vnd(num(a.monthlyCostVND) / 4) + " · chốt chu kỳ, mốc mới " + dmy(a.anchor));
      toast(a.name + ": xong 4/4 tuần. Chu kỳ mới bắt đầu " + dmy(a.anchor));
    } else {
      a.paidWeeks = week;
      audit("Thanh toán", a.name, "tuần " + week + "/4 · " + vnd(num(a.monthlyCostVND) / 4));
      toast(a.name + ": đã trả tuần " + week + "/4");
    }
    save(); render();
  }

  function undoLast(id) {
    var a = byId(id); if (!a || !a.log || !a.log.length) return;
    var last = a.log.pop();
    if (last.week === 4) { a.paidWeeks = 3; a.anchor = last.cycleAnchor; }
    else { a.paidWeeks = Math.max(0, a.paidWeeks - 1); }
    audit("Hoàn tác", a.name, "bỏ lần trả tuần " + last.week + "/4");
    save(); render(); toast("Đã hoàn tác lần trả gần nhất");
  }

  /* ---------------- hiển thị ---------------- */
  function stat(l, m, s, tone) {
    return '<div class="stat"><div class="stat-l">' + l + '</div><div class="stat-m mono' +
      (tone ? " t-" + tone : "") + '">' + m + '</div><div class="stat-s">' + s + "</div></div>";
  }

  function cardHTML(a, d) {
    var st = ST[d.status], off = a.active === false;
    var pDue = {};
    (a.log || []).forEach(function (e) { if (e.cycleAnchor === a.anchor) pDue[e.week - 1] = e.dueOn; });
    var punch = "";
    for (var i = 0; i < 4; i++) {
      var paid = i < a.paidWeeks, isNext = i === a.paidWeeks, late = isNext && d.left < 0;
      punch += '<div class="cell' + (paid ? " paid" : "") + (isNext ? " next" : "") + (late ? " late" : "") + '">' +
        '<span class="cell-w">T' + (i + 1) + '</span><span class="cell-d mono">' +
        dm(paid && pDue[i] ? pDue[i] : d.dues[i]) + "</span>" +
        (paid ? '<span class="stamp">ĐÃ TRẢ</span>' : "") + "</div>";

    /* thanh trạng thái khi đang bị block */

    }

    var upPct = Math.round(d.uptime * 100);
    var v = verdict(d);

    /* nút hành động chính: đang block thì ưu tiên mở lại */
    var actionHTML = "";
    if (!off) {
      actionHTML = d.cur

          '<div class="due-note">Tuần ' + Math.min(a.paidWeeks + 1, 4) + "/4 đến hạn <b>" + dmy(d.nextDue) +
          "</b> — " + dueText + shTxt + "</div>";
    }

    /* ---- khối chu kỳ nhận, đối xứng với chu kỳ trả ---- */
    var rDue = {};
    (a.recvLog || []).forEach(function (e) { if (e.cycleAnchor === a.payAnchor) rDue[e.seq - 1] = e.dueOn; });
    var rPunch = "";
    for (var j = 0; j < d.per; j++) {
      var gotIt = j < d.gc, rNext = j === d.gc, rLate = rNext && d.pLeft < 0 && d.recvActive;
      rPunch += '<div class="cell' + (gotIt ? " paid" : "") + (rNext ? " next" : "") + (rLate ? " late" : "") + '">' +
        '<span class="cell-w">L' + (j + 1) + '</span><span class="cell-d mono">' +

    }
    var rNote = !d.recvActive ? "Đang block — chu kỳ nhận tạm dừng"
      : d.pLeft < 0 ? "Lần " + (d.gc + 1) + "/" + d.per + " dự kiến <b>" + dmy(d.nextPayout) + "</b> — <b>trễ " + Math.abs(d.pLeft) + " ngày</b>"
      : "Lần " + (d.gc + 1) + "/" + d.per + " dự kiến <b>" + dmy(d.nextPayout) + "</b> — " +
        (d.pLeft === 0 ? "hôm nay" : d.pLeft === 1 ? "ngày mai" : "còn " + d.pLeft + " ngày");

    var recvHTML = off ? "" :
      '<div class="perf"></div>' +
      '<div class="cyc"><span class="cyc-l">Chu kỳ nhận · ' + d.cd + ' ngày' +
      (d.shift ? '<b class="shf">+' + d.shift + ' ngày</b>' : "") +
      '</span><span class="cyc-v mono">' + dm(d.payDues[0]) + " → " + dm(d.payDues[d.per - 1]) + "</span></div>" +
      '<div class="punch recv" style="grid-template-columns:repeat(' + d.per + ',1fr)">' + rPunch + "</div>" +
      (d.recvActive
        ? '<div class="pay"><button class="btn recv-btn" data-act="got" data-id="' + a.id + '">' +
          ic("download", 15) + " Đánh dấu đã nhận · " + usdF(d.perUSD) + "</button>" +
          ((a.recvLog && a.recvLog.length) ? '<button class="icon sm undo" data-act="undoGot" data-id="' + a.id +
            '" title="Hoàn tác lần nhận gần nhất">' + ic("undo") + "</button>" : "") + "</div>"
        : "") +
      '<div class="due-note">' + rNote + "</div>" +
      '<div class="prog sm"><div class="prog-h"><span>Chu kỳ này</span><span class="mono">' +
      usdF(d.cycGot) + " / " + usdF(d.cycExpect) + '</span></div><div class="prog-bar"><i style="width:' +
      Math.min(100, d.cycExpect > 0 ? d.cycGot / d.cycExpect * 100 : 0) + '%"></i></div></div>';

    /* đã nhận trong tháng dương lịch này */
    var mk = todayISO().slice(0, 7), gotM = 0;
    (a.recvLog || []).forEach(function (e) { if (e.gotOn.indexOf(mk) === 0) gotM += num(e.amountUSD); });

    return '<article class="card v-' + v.k + (off ? " is-off" : "") + (d.cur ? " is-blocked" : "") + '">' +
      '<div class="c-top"><div class="c-id"><h3 class="c-name"><span class="seqno">' +
      pad(num(a.seq)) + "</span>" + esc(a.name) + "</h3>" +
      '<div class="c-meta">thuê ' + dmy(a.rentDate) + " · " + num(a.connections) + " kết nối</div></div>" +
      '<span class="badge ' + st[1] + '">' + st[0] + "</span></div>" +
      barHTML +
      '<div class="perf"></div>' +
      '<div class="cyc"><span class="cyc-l">Chu kỳ trả' +
      (d.shift ? '<b class="shf">+' + d.shift + ' ngày</b>' : "") +
      '</span><span class="cyc-v mono">' + dm(d.dues[0]) + " → " + dm(d.dues[3]) + "</span></div>" +
      '<div class="punch">' + punch + "</div>" +
      actionHTML +
      recvHTML +
      '<div class="perf"></div>' +

      '<div class="mgrid">' +
      '<div class="m"><div class="m-l">Lãi thực / tháng</div><div class="m-v ' +
      (d.realProfit >= 0 ? "t-green" : "t-red") + '">' + vnd(d.realProfit) + "</div>" +
      '<div class="m-s">' + (d.blockCount ? "danh nghĩa " + vndShort(d.profit) : "biên " + Math.round(d.margin * 100) + "%") + "</div></div>" +
      '<div class="m"><div class="m-l">Uptime ' + d.span + ' ngày</div><div class="m-v ' +
      (upPct < S.minUptime ? "t-red" : "t-green") + '">' + upPct + "%</div>" +
      '<div class="m-s">' + (d.blockCount ? d.blockDaysTotal + " ngày chết · " + d.blockCount + " lần" : "chưa lần nào block") + "</div></div>" +
      '<div class="m"><div class="m-l">Thu / tháng</div><div class="m-v">' + vnd(d.inVND) + "</div>" +
      '<div class="m-s' + (d.closedCyc && d.fill < 0.92 ? " t-red" : "") + '">' +
      (d.closedCyc ? "nhận đủ " + Math.round(d.fill * 100) + "% · hụt " + usdF(d.shortUSD)
        : usdF(a.monthlyIncomeUSD)) + "</div></div>" +
      '<div class="m"><div class="m-l">Chi / tháng</div><div class="m-v">' + vnd(d.outVND) + "</div>" +
      '<div class="m-s">' + vnd(d.weekly) + " / tuần</div></div></div>" +

      '<div class="mfoot"><span>Đã nhận tháng này <b>' + usdF(gotM) + "</b> / " + usdF(a.monthlyIncomeUSD) +
      "</span><span>" + usdF(d.perUSD) + " × " + d.per + " lần</span></div>" +

      '<div class="tl"><div class="tl-bar" style="background:' + timelineBG(a, d.span) + '"></div>' +
      '<div class="tl-cap"><span class="vd v-' + v.k + '">' + v.l + " — " + v.r + "</span>" +
      (d.blockCount ? '<button class="link" data-act="bhist" data-id="' + a.id + '">' + d.blockCount +
        " lần block</button>" : '<span>' + d.span + " ngày liền không lỗi</span>") + "</div></div>" +

      (a.note ? '<p class="note">' + esc(a.note) + "</p>" : "") +
      '<div class="c-act">' +
      '<button class="link" data-act="edit" data-id="' + a.id + '">' + ic("pencil", 12) + " Sửa</button>" +
      (off || d.cur ? "" : '<button class="link" data-act="blockDlg" data-id="' + a.id + '">' + ic("alert", 12) + " Ghi block</button>") +
      '<button class="link" data-act="toggle" data-id="' + a.id + '">' + ic("power", 12) + " " +
      (off ? "Thuê lại" : "Ngưng thuê") + "</button>" +
      '<button class="link" data-act="csvAcc" data-id="' + a.id + '">' + ic("download", 12) + " Sao kê</button>" +
      '<button class="link danger" data-act="del" data-id="' + a.id + '">' + ic("trash", 12) + " Xoá</button>" +
      "</div></article>";
  }

  /* ---- hàng đợi việc hôm nay ---- */
  function queueHTML(live) {
    var items = [];
    live.forEach(function (r) {
      if (r.d.cur) {
        items.push({ p: 4, r: r, why: r.d.curDays === 0 ? "block từ hôm nay" : "block " + r.d.curDays + " ngày",
          amt: null, act: "unblockDlg", btn: "Đã mở" });
        return;
      }
      if (r.d.left < 0) items.push({ p: 0, r: r, why: "trả trễ " + Math.abs(r.d.left) + " ngày",
        amt: r.d.weekly, act: "pay", btn: "Đã trả" });
      else if (r.d.left === 0) items.push({ p: 2, r: r, why: "đến hạn trả hôm nay",
        amt: r.d.weekly, act: "pay", btn: "Đã trả" });
      if (r.d.pLeft < 0) items.push({ p: 1, r: r, why: "tiền về trễ " + Math.abs(r.d.pLeft) + " ngày",
        amt: null, act: "got", btn: "Đã nhận" });
      else if (r.d.pLeft === 0) items.push({ p: 3, r: r, why: "dự kiến nhận hôm nay",
        amt: null, act: "got", btn: "Đã nhận" });
    });
    items.sort(function (x, y) { return x.p - y.p || y.r.d.weekly - x.r.d.weekly; });

    var tmr = live.filter(function (r) { return r.d.dueActive && r.d.left === 1; });
    var tmrSum = 0;
    tmr.forEach(function (r) { tmrSum += r.d.weekly; });

    if (!items.length) {
      var soon = live.filter(function (r) { return r.d.dueActive && r.d.left > 0; })
        .sort(function (x, y) { return x.d.left - y.d.left; })[0];
      if (!soon && !tmr.length) return "";
      return '<div class="queue calm"><div class="q-h"><span class="q-t">Hôm nay không có việc</span>' +
        '<span class="q-s mono">' + live.length + " acc đang chạy</span></div>" +
        '<div class="calm-b">Khoản gần nhất: <b>' + esc(soon.a.name) + "</b> ngày <b>" + dmy(soon.d.nextDue) +
        "</b> — " + vnd(soon.d.weekly) + " (còn " + soon.d.left + " ngày).</div></div>";
    }

    var sum = 0, rows = "";
    items.forEach(function (it, i) {
      if (it.amt) sum += it.amt;
      rows += '<div class="q-row p-' + it.p + '"><span class="q-n mono">' + (i + 1) + "</span>" +
        '<span class="q-name">' + esc(it.r.a.name) + "</span>" +
        '<span class="q-why">' + it.why + "</span>" +
        '<span class="q-amt">' + (it.amt ? vnd(it.amt) : "—") + "</span>" +
        '<button class="q-btn" data-act="' + it.act + '" data-id="' + it.r.a.id + '">' + it.btn + "</button></div>";
    });

    var more = "";
    if (tmr.length) {
      more = '<div class="q-more">Ngày mai ' + dm(addDays(todayISO(), 1)) + " — <b>" +
        tmr.map(function (r) { return esc(r.a.name); }).join(", ") + "</b> · " + vnd(tmrSum) + "</div>";
    }

    return '<div class="queue"><div class="q-h"><span class="q-t">Việc hôm nay</span>' +
      '<span class="q-s mono">' + items.length + " việc" + (sum ? " · chi " + vnd(sum) : "") + "</span></div>" +
      rows + more + "</div>";
  }

  /* ---- nhận định toàn danh mục ---- */
  function insightHTML(rows) {
    if (rows.length < 2) return "";
    var pos = rows.filter(function (r) { return r.d.realProfit > 0; })
      .sort(function (x, y) { return y.d.realProfit - x.d.realProfit; });
    var totalPos = 0; pos.forEach(function (r) { totalPos += r.d.realProfit; });
    var acc = 0, k = 0;
    for (var i = 0; i < pos.length && acc < totalPos * 0.7; i++) { acc += pos[i].d.realProfit; k++; }
    var loss = rows.filter(function (r) { return r.d.realProfit < 0; }).length;
    var drop = rows.filter(function (r) { return verdict(r.d).k === "drop"; }).length;
    var out = [];
    if (k && pos.length > 1) out.push("<b>" + k + "</b> / " + rows.length + " acc tạo 70% lãi thực");
    if (loss) out.push('<span class="bad"><b>' + loss + "</b> acc đang lỗ thực tế</span>");
    if (drop) out.push('<span class="bad"><b>' + drop + "</b> acc nên cân nhắc bỏ</span>");
    if (!out.length) out.push("Toàn bộ " + rows.length + " acc đều đạt ngưỡng uptime " + S.minUptime + "% và biên " + S.minMargin + "%");
    return '<div class="insight">' + out.join("<span>·</span>") + "</div>";
  }

  function chartHTML() {
    if (!S.accounts.length) {
      return '<div class="empty">' + ic("history", 22) + "<h3>Chưa có dữ liệu để vẽ</h3>" +
        "<p>Thêm tài khoản và ghi vài lần thu chi, biểu đồ sẽ tự dựng.</p></div>";
    }
    var today = todayISO(), d0 = fromISO(today), out = "";

    /* ---------- A. Dòng tiền thực tế 6 tháng ---------- */
    var months = [], flow = {};
    for (var i = 5; i >= 0; i--) {
      var dd = new Date(d0.getFullYear(), d0.getMonth() - i, 1);
      var k = dd.getFullYear() + "-" + pad(dd.getMonth() + 1);
      months.push(k); flow[k] = { in: 0, out: 0 };
    }
    S.accounts.forEach(function (a) {
      (a.recvLog || []).forEach(function (e) { var k = e.gotOn.slice(0, 7); if (flow[k]) flow[k].in += num(e.amountVND); });
      (a.log || []).forEach(function (e) { var k = e.paidOn.slice(0, 7); if (flow[k]) flow[k].out += num(e.amountVND); });
    });
    var mxF = 1, tIn = 0, tOut = 0;
    months.forEach(function (k) { mxF = Math.max(mxF, flow[k].in, flow[k].out); tIn += flow[k].in; tOut += flow[k].out; });

    out += '<div class="ch"><div class="ch-h"><span>Dòng tiền thực tế</span><span class="mono ' +
      (tIn - tOut >= 0 ? "t-green" : "t-red") + '">' + vnd(tIn - tOut) + " / 6 tháng</span></div><div class=\"ch-b\">";
    months.forEach(function (k) {
      var f = flow[k], net = f.in - f.out, mm = k.split("-");
      out += '<div class="cf"><span class="cf-m mono">' + mm[1] + "/" + mm[0].slice(2) + "</span>" +
        '<div class="cf-bars"><div class="cf-b cin" style="width:' + (f.in / mxF * 100) + '%"></div>' +
        '<div class="cf-b cout" style="width:' + (f.out / mxF * 100) + '%"></div></div>' +
        '<span class="cf-n mono ' + (net >= 0 ? "t-green" : "t-red") + '">' +
        (net > 0 ? "+" : "") + vndShort(net) + "</span></div>";
    });
    out += '<div class="ch-lg"><span><i class="sw cin"></i>thu ' + vndShort(tIn) +
      '</span><span><i class="sw cout"></i>chi ' + vndShort(tOut) + "</span></div>" +
      '<p class="ch-note">Tiền thật đã tick, không phải con số cam kết. Cột thu thấp hơn chi kéo dài là dấu hiệu phải dừng thuê.</p></div>';

    /* ---------- B. Tỷ lệ hoạt động theo tháng ---------- */
    out += '<div class="ch"><div class="ch-h"><span>Tỷ lệ hoạt động toàn danh mục</span><span class="mono">uptime</span></div><div class="ch-b">';
    months.forEach(function (k) {
      var mm = k.split("-");
      var mStart = k + "-01";
      var lastD = new Date(+mm[0], +mm[1], 0).getDate();
      var mEnd = k + "-" + pad(lastD);
      if (mEnd > today) mEnd = today;
      var tot = 0, blk = 0;
      S.accounts.forEach(function (a) {
        var st = a.rentDate > mStart ? a.rentDate : mStart;
        if (st > mEnd) return;
        tot += diffDays(st, mEnd) + 1;
        (a.blocks || []).forEach(function (b) {
          var bs = b.from > st ? b.from : st;
          var be = b.to || today; if (be > mEnd) be = mEnd;
          var kk = diffDays(bs, be); if (kk > 0) blk += kk;
        });
      });
      var up = tot > 0 ? (tot - blk) / tot : 1;
      out += '<div class="cf"><span class="cf-m mono">' + mm[1] + "/" + mm[0].slice(2) + "</span>" +
        '<div class="up-track"><i style="width:' + (up * 100) + "%;background:" +
        (up < S.minUptime / 100 ? "var(--red)" : "var(--green)") + '"></i></div>' +
        '<span class="cf-n mono">' + (tot ? Math.round(up * 100) + "%" : "—") + "</span></div>";
    });
    out += '<p class="ch-note">Tính trên tổng số ngày-tài khoản trong tháng. Tháng nào tụt sâu, mở Nhật ký xem hôm đó anh đổi gì.</p></div>';

    /* ---------- C. Bao nhiêu ngày thì bị block ---------- */
    var life = S.accounts.map(function (a) {
      var fb = null;
      (a.blocks || []).forEach(function (b) { if (!fb || b.from < fb) fb = b.from; });
      return { a: a, days: diffDays(a.rentDate, fb || today), hit: !!fb };
    }).sort(function (x, y) { return x.days - y.days; });
    var hits = life.filter(function (x) { return x.hit; }).map(function (x) { return x.days; });
    var med = hits.length ? (hits.length % 2 ? hits[(hits.length - 1) / 2]
      : Math.round((hits[hits.length / 2 - 1] + hits[hits.length / 2]) / 2)) : null;
    var mxL = Math.max(1, life.length ? life[life.length - 1].days : 1);

  function ledgerHTML() {
    var all = [];
    S.accounts.forEach(function (a) {
      (a.log || []).forEach(function (e) {
        all.push({ t: "out", d: e.paidOn, name: e.name || a.name, vnd: num(e.amountVND),
          lbl: "trả tuần " + e.week + "/4 · hạn " + dm(e.dueOn), id: e.id });
      });
      (a.recvLog || []).forEach(function (e) {
        all.push({ t: "in", d: e.gotOn, name: e.name || a.name, vnd: num(e.amountVND),
          usd: num(e.amountUSD), lbl: "nhận lần " + e.seq + " · dự kiến " + dm(e.dueOn), id: e.id });
      });
    });
    if (!all.length) {
      return '<div class="empty">' + ic("history", 22) + "<h3>Sổ chưa có dòng nào</h3>" +

  function render() {
    document.getElementById("rateChip").textContent = NF.format(S.rate);

    var rows = S.accounts.map(function (a) { return { a: a, d: derive(a) }; });
    var live = rows.filter(function (r) { return r.a.active !== false; });

    var t = { in: 0, out: 0, conn: 0, week: 0, usd: 0, real: 0, blocked: 0, everBlocked: 0 };
    live.forEach(function (r) {
      t.in += r.d.inVND; t.out += r.d.outVND; t.usd += num(r.a.monthlyIncomeUSD);
      t.conn += num(r.a.connections);
      t.real += r.d.realProfit;
      if (r.d.cur) t.blocked++;
      if (r.d.blockCount) t.everBlocked++;
      if (r.d.dueActive && r.d.left <= 6) t.week += r.d.weekly;
    });
    var profit = t.in - t.out;
    var mth = todayISO().slice(0, 7), paidM = 0;
    S.accounts.forEach(function (a) {
      (a.log || []).forEach(function (e) { if (e.paidOn.indexOf(mth) === 0) paidM += num(e.amountVND); });
    });

    document.getElementById("rail").innerHTML =
      stat("Thu / tháng", vnd(t.in), usdF(t.usd)) +
      stat("Chi / tháng", vnd(t.out), vnd(t.out / 4) + " / tuần") +
      stat(t.everBlocked ? "Lãi thực tế sau block" : "Lãi / tháng",
        t.everBlocked ? vnd(t.real) : vnd(profit),
        t.everBlocked ? "danh nghĩa " + vndShort(profit) + " · hụt " + vndShort(profit - t.real)
          : (t.in > 0 ? Math.round(profit / t.in * 100) + "% biên" : "—"),
        (t.everBlocked ? t.real : profit) >= 0 ? "green" : "red") +
      stat("Phải trả 7 ngày tới", vnd(t.week), "đã trả tháng này " + vndShort(paidM)) +
      stat("Đang thuê", String(live.length), t.conn + " kết nối" + (t.blocked ? " · " + t.blocked + " đang block" : ""));

    document.getElementById("alerts").innerHTML = queueHTML(live) + insightHTML(live);

    var showAcc = S.tab === "accounts";
    document.getElementById("searchBox").className = showAcc ? "search" : "search hide";
    document.getElementById("filters").className = showAcc ? "filters" : "filters hide";
    document.getElementById("sortWrap").className = showAcc ? "" : "hide";
    document.getElementById("tabAcc").className = showAcc ? "on" : "";
    document.getElementById("tabLed").className = S.tab === "ledger" ? "on" : "";
    document.getElementById("tabCh").className = S.tab === "chart" ? "on" : "";
    document.getElementById("tabLog").className = S.tab === "audit" ? "on" : "";

    var list = document.getElementById("list");
    if (S.tab === "ledger") { list.className = ""; list.innerHTML = ledgerHTML(); return; }
    if (S.tab === "chart") { list.className = ""; list.innerHTML = chartHTML(); return; }
    if (S.tab === "audit") { list.className = ""; list.innerHTML = auditHTML(); return; }

    var v = rows.filter(function (r) {
      if (S.filter === "due") return ["today", "tomorrow", "soon"].indexOf(r.d.status) >= 0;
      if (S.filter === "overdue") return r.d.status === "overdue";
      if (S.filter === "block") return !!r.d.cur;
      if (S.filter === "risk") return verdict(r.d).k === "drop" || verdict(r.d).k === "watch";
      if (S.filter === "off") return r.a.active === false;
      return r.a.active !== false;
    });
    var q = S.q.trim().toLowerCase();
    if (q) v = v.filter(function (r) {
      return (r.a.name || "").toLowerCase().indexOf(q) >= 0 || (r.a.note || "").toLowerCase().indexOf(q) >= 0;
    });

    var VW = { drop: 0, watch: 1, new: 2, keep: 3 };
    v.sort(function (x, y) {
      if (S.sort === "profit") return y.d.realProfit - x.d.realProfit;
      if (S.sort === "uptime") return x.d.uptime - y.d.uptime;
      if (S.sort === "risk") return VW[verdict(x.d).k] - VW[verdict(y.d).k] || x.d.uptime - y.d.uptime;
      if (S.sort === "name") return (x.a.name || "").localeCompare(y.a.name || "");
      if (S.sort === "urgent") {
        var bx = x.d.cur ? 0 : 1, by = y.d.cur ? 0 : 1;
        return bx - by || x.d.nextDue.localeCompare(y.d.nextDue) || num(x.a.seq) - num(y.a.seq);
      }
      return num(x.a.seq) - num(y.a.seq);
    });

    if (!v.length) {
      list.className = "";
      list.innerHTML = '<div class="empty">' + ic("wallet", 22) +
        "<h3>" + (S.accounts.length ? "Không có tài khoản nào ở mục này" : "Sổ đang trống") + "</h3><p>" +
        (S.accounts.length ? "Đổi bộ lọc để xem các tài khoản khác."
          : "Thêm tài khoản đầu tiên để theo dõi tiền thu, tiền phải trả hằng tuần và ngày đến hạn.") + "</p>" +
        (S.accounts.length ? "" : '<button class="btn primary" data-act="add">' + ic("plus", 15) + " Thêm tài khoản</button>") +
        "</div>";
      return;
    }
    list.className = "grid";
    list.innerHTML = v.map(function (r) { return cardHTML(r.a, r.d); }).join("");
  }

  /* ================= ĐỒNG BỘ ĐÁM MÂY =================
     Gọi thẳng REST API của Supabase bằng fetch, không nạp thư viện.

  var SUPABASE_URL = "https://ryqqestvrbuxjyaewwpw.supabase.co";

  var CKEY = "acct-rental-cloud-v1";

  function cfgLoad() {
    try {
      var raw = canStore ? localStorage.getItem(CKEY) : null;
      if (!raw) return;
      var d = JSON.parse(raw);
      CFG.url = SUPABASE_URL || d.url || ""; CFG.key = SUPABASE_KEY || d.key || "";
      CFG.token = d.token || ""; CFG.refresh = d.refresh || "";
      CFG.uid = d.uid || ""; CFG.email = d.email || "";
    } catch (e) {}
  }
  function cfgSave() {
    try { if (canStore) localStorage.setItem(CKEY, JSON.stringify(CFG)); } catch (e) {}
  }
  function setSync(st, msg) {
    syncSt = st; syncMsg = msg;
    var c = document.getElementById("syncChip"), l = document.getElementById("syncLbl");
    if (!c) return;
    c.className = "sync" + (st === "ok" ? " on" : st === "busy" ? " busy" : st === "err" ? " err" : "");

  function hhmm() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  /* fetch có gắn khoá, tự làm mới token khi hết hạn */
  function api(path, opts, retried) {
    opts = opts || {};
    var h = { "apikey": CFG.key, "Content-Type": "application/json" };
    if (CFG.token) h["Authorization"] = "Bearer " + CFG.token;
    for (var k in (opts.headers || {})) h[k] = opts.headers[k];
    return fetch(CFG.url.replace(/\/+$/, "") + path, {
      method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 401 && CFG.refresh && !retried) {
        return refreshToken().then(function () { return api(path, opts, true); });
      }
      if (!r.ok) return r.text().then(function (t) {
        var m = t; try { m = JSON.parse(t).msg || JSON.parse(t).message || JSON.parse(t).error_description || t; } catch (e) {}
        throw new Error(m || ("Lỗi " + r.status));
      });
      return r.status === 204 ? null : r.json().catch(function () { return null; });
    });
  }

  function refreshToken() {
    return fetch(CFG.url.replace(/\/+$/, "") + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: CFG.refresh })
    }).then(function (r) { if (!r.ok) throw new Error("Phiên đăng nhập đã hết hạn"); return r.json(); })
      .then(function (d) {
        CFG.token = d.access_token; CFG.refresh = d.refresh_token; cfgSave();
      });
  }

  function auth(mode, email, pass) {
    var path = mode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
    return fetch(CFG.url.replace(/\/+$/, "") + path, {
      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pass })
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.msg || d.message || d.error_description || "Không đăng nhập được");
        return d;
      });
    }).then(function (d) {
      if (!d.access_token) throw new Error("Tài khoản đã tạo nhưng cần xác nhận email. Hãy tắt Confirm email trong Supabase rồi đăng nhập lại.");
      CFG.token = d.access_token; CFG.refresh = d.refresh_token;
      CFG.uid = (d.user && d.user.id) || ""; CFG.email = (d.user && d.user.email) || email;
      cfgSave();
    });
  }

  function pull(silent) {
    if (!CFG.token || !CFG.uid) return Promise.resolve();
    pulling = true; setSync("busy", "Đang tải…");
    return api("/rest/v1/ledgers?select=data,updated_at&user_id=eq." + CFG.uid)
      .then(function (rows) {
        var row = rows && rows[0];
        if (!row) { pulling = false; return push(true); }
        var remote = row.data || {};
        var rT = remote.updatedAt || row.updated_at || "";
        var lT = S.updatedAt || "";
        if (rT > lT) {
          S.accounts = (remote.accounts || []).map(migrate);
          S.audit = Array.isArray(remote.audit) ? remote.audit : S.audit;
          seedSeq();
          S.rate = Number(remote.rate) || S.rate;
          S.minUptime = Number(remote.minUptime) || S.minUptime;
          S.minMargin = Number(remote.minMargin) || S.minMargin;
          S.updatedAt = rT;
          saveLocal(); render();
          if (!silent) toast("Đã tải bản mới nhất từ đám mây");
        } else if (lT > rT) {
          pulling = false; return push(true);
        }
        pulling = false; setSync("ok", "Đồng bộ " + hhmm());
      })
      .catch(function (e) { pulling = false; setSync("err", "Lỗi tải"); warn("Đồng bộ: " + e.message); });
  }

  function push(silent) {
    if (!CFG.token || !CFG.uid) return Promise.resolve();
    setSync("busy", "Đang lưu…");
    var payload = { accounts: S.accounts, rate: S.rate, audit: S.audit, minUptime: S.minUptime,
      minMargin: S.minMargin, updatedAt: S.updatedAt, v: 3 };
    return api("/rest/v1/ledgers?on_conflict=user_id", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: { user_id: CFG.uid, data: payload, updated_at: new Date().toISOString() }
    }).then(function () {
      setSync("ok", "Đồng bộ " + hhmm()); warn("");
      if (!silent) toast("Đã đẩy lên đám mây");
    }).catch(function (e) { setSync("err", "Lỗi lưu"); warn("Đồng bộ: " + e.message); });
  }

  function schedulePush() {
    if (!CFG.token || pulling) return;

    setSync("busy", "Chờ lưu…");

    var old = document.querySelector(".toast"); if (old) old.remove();

  function submitForm() {
    var $ = function (id) { return document.getElementById(id); };
    var name = $("fName").value.trim();
    if (!name) {
      $("fName").className = "in bad";
      $("hName").className = "hint bad";
      $("hName").textContent = "Nhập tên để phân biệt tài khoản trong sổ.";
      $("fName").focus(); return;
    }
    var cd = num($("fCd").value) || 15;
    var inc = num($("fInc").value);
    var anchor = $("fAnchor").value || todayISO();
    var data = {
      name: name, rentDate: $("fRent").value || todayISO(),
      monthlyIncomeUSD: inc, payoutCycleDays: cd,
      perPayoutUSD: num($("fPer").value), perPayoutManual: Math.abs(num($("fPer").value) - inc * cd / 30) > 0.01,
      connections: num($("fConn").value), monthlyCostVND: num($("fCost").value),
      anchor: anchor, anchorDay: fromISO(anchor).getDate(),
      payAnchor: $("fPAnchor").value || todayISO(),
      payAnchorDay: fromISO($("fPAnchor").value || todayISO()).getDate(),
      note: $("fNote").value, active: true, seq: num($("fSeq").value)
    };
    if (!data.seq) { var mq = 0; S.accounts.forEach(function (x) { if (num(x.seq) > mq) mq = num(x.seq); });
      data.seq = editId ? num((byId(editId) || {}).seq) || mq + 1 : mq + 1; }
    data.blockPolicy = "both";
    if (editId) {
      var a = byId(editId);
      data.active = a.active !== false;
      for (var k in data) a[k] = data[k];
      if ($("fReset") && $("fReset").checked) a.paidWeeks = 0;
      audit("Sửa tài khoản", name, "cập nhật thông tin");
      toast("Đã lưu " + name);
    } else {
      data.id = uid(); data.paidWeeks = 0; data.log = []; data.blocks = [];
      data.gotCount = 0; data.recvLog = [];
      data.payoutShift = 0; data.createdAt = todayISO();
      S.accounts.push(data);

        "/tháng · chi " + vnd(data.monthlyCostVND) + "/tháng");
      toast("Đã thêm " + name);
    }
    save(); closeModal(); render();
  }
